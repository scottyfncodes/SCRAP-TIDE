anchor="start" >itself on pickup:</text><text x="401.0" y="56.9" font-size="6.9" fill="#d9d2bf" font-family="Barlow" font-weight="500" text-anchor="start" >read_map merged)</text><line x1="466.5" y1="43.3" x2="468.5" y2="43.3" stroke="#4f9484" stroke-width="1" /><polygon points="472.5,43.3 468.5,45.5 468.5,41.1" fill="#4f9484" stroke="none" stroke-width="1" /><polygon points="476.5,9.0 543.0,9.0 543.0,72.7 538.0,77.7 471.5,77.7 471.5,14.0" fill="#0d1113" stroke="#4f9484" stroke-width="1" /><text x="477.5" y="20.0" font-size="9" fill="#4f9484" font-family="Saira Stencil One" text-anchor="start" >6</text><text x="476.5" y="32.0" font-size="6.9" fill="#d9d2bf" font-family="Barlow" font-weight="500" text-anchor="start" >Sail home: the</text><text x="476.5" y="40.3" font-size="6.9" fill="#d9d2bf" font-family="Barlow" font-weight="500" text-anchor="start" >Sunken Tower is on</text><text x="476.5" y="48.6" font-size="6.9" fill="#d9d2bf" font-family="Barlow" font-weight="500" text-anchor="start" >the way, SALVAGE it</text><text x="476.5" y="56.9" font-size="6.9" fill="#d9d2bf" font-family="Barlow" font-weight="500" text-anchor="start" >(optional, but the</text><text x="476.5" y="65.2" font-size="6.9" fill="#d9d2bf" font-family="Barlow" font-weight="500" text-anchor="start" >marker passes it)</text><line x1="542.0" y1="43.3" x2="544.0" y2="43.3" stroke="#4f9484" stroke-width="1" /><polygon points="548.0,43.3 544.0,45.5 544.0,41.1" fill="#4f9484" stroke="none" stroke-width="1" /><polygon points="552.0,9.0 618.5,9.0 618.5,72.7 613.5,77.7 547.0,77.7 547.0,14.0" fill="#0d1113" stroke="#4f9484" stroke-width="1" /><text x="553.0" y="20.0" font-size="9" fill="#4f9484" font-family="Saira Stencil One" text-anchor="start" >7</text><text x="552.0" y="32.0" font-size="6.9" fill="#d9d2bf" font-family="Barlow" font-weight="500" text-anchor="start" >Refit at Driftholm:</text><text x="552.0" y="40.3" font-size="6.9" fill="#d9d2bf" font-family="Barlow" font-weight="500" text-anchor="start" >sell to Pip, then</text><text x="552.0" y="48.6" font-size="6.9" fill="#d9d2bf" font-family="Barlow" font-weight="500" text-anchor="start" >fit a part with</text><text x="552.0" y="56.9" font-size="6.9" fill="#d9d2bf" font-family="Barlow" font-weight="500" text-anchor="start" >Marlo (sell +</text><text x="552.0" y="65.2" font-size="6.9" fill="#d9d2bf" font-family="Barlow" font-weight="500" text-anchor="start" >upgrade)</text><line x1="617.5" y1="43.3" x2="619.5" y2="43.3" stroke="#4f9484" stroke-width="1" /><polygon points="623.5,43.3 619.5,45.5 619.5,41.1" fill="#4f9484" stroke="none" stroke-width="1" /><polygon points="627.5,9.0 694.0,9.0 694.0,72.7 689.0,77.7 622.5,77.7 622.5,14.0" fill="#0d1113" stroke="#4f9484" stroke-width="1" /><text x="628.5" y="20.0" font-size="9" fill="#4f9484" font-family="Saira Stencil One" text-anchor="start" >8</text><text x="627.5" y="32.0" font-size="6.9" fill="#d9d2bf" font-family="Barlow" font-weight="500" text-anchor="start" >The world drowned.</text><text x="627.5" y="40.3" font-size="6.9" fill="#d9d2bf" font-family="Barlow" font-weight="500" text-anchor="start" >You didn't. (free)</text><rect x="4.0" y="83.7" width="82.0" height="72.7" rx="0" fill="#283135" stroke="none" stroke-width="1" /><text x="45.0" y="118.0" font-size="9.5" fill="#d6a62a" font-family="Barlow Condensed" font-weight="800" text-anchor="middle" >AMBITIOUS</text><text x="45.0" y="130.0" font-size="8" fill="#c8c0aa" font-family="Share Tech Mono" text-anchor="middle" >7 steps</text><polygon points="99.0,85.7 176.3,85.7 176.3,149.3 171.3,154.3 94.0,154.3 94.0,90.7" fill="#0d1113" stroke="#d6a62a" stroke-width="1" /><text x="100.0" y="96.7" font-size="9" fill="#d6a62a" font-family="Saira Stencil One" text-anchor="start" >1</text><text x="99.0" y="108.7" font-size="6.9" fill="#d9d2bf" font-family="Barlow" font-weight="500" text-anchor="start" >Old Wren at the pier:</text><text x="99.0" y="117.0" font-size="6.9" fill="#d9d2bf" font-family="Barlow" font-weight="500" text-anchor="start" >'A bottle washed up on</text><text x="99.0" y="125.3" font-size="6.9" fill="#d9d2bf" font-family="Barlow" font-weight="500" text-anchor="start" >Turtle, the gulls say.</text><text x="99.0" y="133.6" font-size="6.9" fill="#d9d2bf" font-family="Barlow" font-weight="500" text-anchor="start" >Bring me what's</text><text x="99.0" y="141.9" font-size="6.9" fill="#d9d2bf" font-family="Barlow" font-weight="500" text-anchor="start" >inside.'</text><line x1="175.3" y1="120.0" x2="177.3" y2="120.0" stroke="#d6a62a" stroke-width="1" /><polygon points="181.3,120.0 177.3,122.2 177.3,117.8" fill="#d6a62a" stroke="none" stroke-width="1" /><polygon points="185.3,85.7 262.6,85.7 262.6,149.3 257.6,154.3 180.3,154.3 180.3,90.7" fill="#0d1113" stroke="#d6a62a" stroke-width="1" /><text x="186.3" y="96.7" font-size="9" fill="#d6a62a" font-family="Saira Stencil One" text-anchor="start" >2</text><text x="185.3" y="108.7" font-size="6.9" fill="#d9d2bf" font-family="Barlow" font-weight="500" text-anchor="start" >Cast off. A flotsam</text><text x="185.3" y="117.0" font-size="6.9" fill="#d9d2bf" font-family="Barlow" font-weight="500" text-anchor="start" >patch on the way</text><text x="185.3" y="125.3" font-size="6.9" fill="#d9d2bf" font-family="Barlow" font-weight="500" text-anchor="start" >teaches easing through</text><text x="185.3" y="133.6" font-size="6.9" fill="#d9d2bf" font-family="Barlow" font-weight="500" text-anchor="start" >(10 s, optional)</text><line x1="261.6" y1="120.0" x2="263.6" y2="120.0" stroke="#d6a62a" stroke-width="1" /><polygon points="267.6,120.0 263.6,122.2 263.6,117.8" fill="#d6a62a" stroke="none" stroke-width="1" /><polygon points="271.6,85.7 348.9,85.7 348.9,149.3 343.9,154.3 266.6,154.3 266.6,90.7" fill="#0d1113" stroke="#d6a62a" stroke-width="1" /><text x="272.6" y="96.7" font-size="9" fill="#d6a62a" font-family="Saira Stencil One" text-anchor="start" >3</text><text x="271.6" y="108.7" font-size="6.9" fill="#d9d2bf" font-family="Barlow" font-weight="500" text-anchor="start" >Turtle Atoll: ashore,</text><text x="271.6" y="117.0" font-size="6.9" fill="#d9d2bf" font-family="Barlow" font-weight="500" text-anchor="start" >the bottle, the clue,</text><text x="271.6" y="125.3" font-size="6.9" fill="#d9d2bf" font-family="Barlow" font-weight="500" text-anchor="start" >the dig. The chest lid</text><text x="271.6" y="133.6" font-size="6.9" fill="#d9d2bf" font-family="Barlow" font-weight="500" text-anchor="start" >is scratched 'R.F.'</text><line x1="347.9" y1="120.0" x2="349.9" y2="120.0" stroke="#d6a62a" stroke-width="1" /><polygon points="353.9,120.0 349.9,122.2 349.9,117.8" fill="#d6a62a" stroke="none" stroke-width="1" /><polygon points="357.9,85.7 435.1,85.7 435.1,149.3 430.1,154.3 352.9,154.3 352.9,90.7" fill="#0d1113" stroke="#d6a62a" stroke-width="1" /><text x="358.9" y="96.7" font-size="9" fill="#d6a62a" font-family="Saira Stencil One" text-anchor="start" >4</text><text x="357.9" y="108.7" font-size="6.9" fill="#d9d2bf" font-family="Barlow" font-weight="500" text-anchor="start" >Kai's raft blips on</text><text x="357.9" y="117.0" font-size="6.9" fill="#d9d2bf" font-family="Barlow" font-weight="500" text-anchor="start" >the radar. RESCUE now</text><text x="357.9" y="125.3" font-size="6.9" fill="#d9d2bf" font-family="Barlow" font-weight="500" text-anchor="start" >(a 60 s detour) or</text><text x="357.9" y="133.6" font-size="6.9" fill="#d9d2bf" font-family="Barlow" font-weight="500" text-anchor="start" >later (g_crew keeps</text><text x="357.9" y="141.9" font-size="6.9" fill="#d9d2bf" font-family="Barlow" font-weight="500" text-anchor="start" >it)</text><line x1="434.1" y1="120.0" x2="436.1" y2="120.0" stroke="#d6a62a" stroke-width="1" /><polygon points="440.1,120.0 436.1,122.2 436.1,117.8" fill="#d6a62a" stroke="none" stroke-width="1" /><polygon points="444.1,85.7 521.4,85.7 521.4,149.3 516.4,154.3 439.1,154.3 439.1,90.7" fill="#0d1113" stroke="#d6a62a" stroke-width="1" /><text x="445.1" y="96.7" font-size="9" fill="#d6a62a" font-family="Saira Stencil One" text-anchor="start" >5</text><text x="444.1" y="108.7" font-size="6.9" fill="#d9d2bf" font-family="Barlow" font-weight="500" text-anchor="start" >The Sunken Tower on</text><text x="444.1" y="117.0" font-size="6.9" fill="#d9d2bf" font-family="Barlow" font-weight="500" text-anchor="start" >the way home: the</text><text x="444.1" y="125.3" font-size="6.9" fill="#d9d2bf" font-family="Barlow" font-weight="500" text-anchor="start" >first SALVAGE and</text><text x="444.1" y="133.6" font-size="6.9" fill="#d9d2bf" font-family="Barlow" font-weight="500" text-anchor="start" >winch (Log g_salvage</text><text x="444.1" y="141.9" font-size="6.9" fill="#d9d2bf" font-family="Barlow" font-weight="500" text-anchor="start" >moves here)</text><line x1="520.4" y1="120.0" x2="522.4" y2="120.0" stroke="#d6a62a" stroke-width="1" /><polygon points="526.4,120.0 522.4,122.2 522.4,117.8" fill="#d6a62a" stroke="none" stroke-width="1" /><polygon points="530.4,85.7 607.7,85.7 607.7,149.3 602.7,154.3 525.4,154.3 525.4,90.7" fill="#0d1113" stroke="#d6a62a" stroke-width="1" /><text x="531.4" y="96.7" font-size="9" fill="#d6a62a" font-family="Saira Stencil One" text-anchor="start" >6</text><text x="530.4" y="108.7" font-size="6.9" fill="#d9d2bf" font-family="Barlow" font-weight="500" text-anchor="start" >Driftholm: sell to</text><text x="530.4" y="117.0" font-size="6.9" fill="#d9d2bf" font-family="Barlow" font-weight="500" text-anchor="start" >Pip, then pick 1 of 3</text><text x="530.4" y="125.3" font-size="6.9" fill="#d9d2bf" font-family="Barlow" font-weight="500" text-anchor="start" >starter parts at a</text><text x="530.4" y="133.6" font-size="6.9" fill="#d9d2bf" font-family="Barlow" font-weight="500" text-anchor="start" >welcome price (sail,</text><text x="530.4" y="141.9" font-size="6.9" fill="#d9d2bf" font-family="Barlow" font-weight="500" text-anchor="start" >rudder or crate)</text><line x1="606.7" y1="120.0" x2="608.7" y2="120.0" stroke="#d6a62a" stroke-width="1" /><polygon points="612.7,120.0 608.7,122.2 608.7,117.8" fill="#d6a62a" stroke="none" stroke-width="1" /><polygon points="616.7,85.7 694.0,85.7 694.0,149.3 689.0,154.3 611.7,154.3 611.7,90.7" fill="#0d1113" stroke="#d6a62a" stroke-width="1" /><text x="617.7" y="96.7" font-size="9" fill="#d6a62a" font-family="Saira Stencil One" text-anchor="start" >7</text><text x="616.7" y="108.7" font-size="6.9" fill="#d9d2bf" font-family="Barlow" font-weight="500" text-anchor="start" >Wren reads the scrap:</text><text x="616.7" y="117.0" font-size="6.9" fill="#d9d2bf" font-family="Barlow" font-weight="500" text-anchor="start" >'R.F. Redfinch. So he</text><text x="616.7" y="125.3" font-size="6.9" fill="#d9d2bf" font-family="Barlow" font-weight="500" text-anchor="start" >did come this way.'</text><text x="616.7" y="133.6" font-size="6.9" fill="#d9d2bf" font-family="Barlow" font-weight="500" text-anchor="start" >The Log opens on two</text><text x="616.7" y="141.9" font-size="6.9" fill="#d9d2bf" font-family="Barlow" font-weight="500" text-anchor="start" >leads</text><rect x="4.0" y="160.3" width="82.0" height="72.7" rx="0" fill="#283135" stroke="none" stroke-width="1" /><text x="45.0" y="194.7" font-size="9.5" fill="#c5371f" font-family="Barlow Condensed" font-weight="800" text-anchor="middle" >WILD CARD</text><text x="45.0" y="206.7" font-size="8" fill="#c8c0aa" font-family="Share Tech Mono" text-anchor="middle" >4 steps</text><polygon points="99.0,162.3 241.0,162.3 241.0,226.0 236.0,231.0 94.0,231.0 94.0,167.3" fill="#0d1113" stroke="#c5371f" stroke-width="1" /><text x="100.0" y="173.3" font-size="9" fill="#c5371f" font-family="Saira Stencil One" text-anchor="start" >1</text><text x="99.0" y="185.3" font-size="6.9" fill="#d9d2bf" font-family="Barlow" font-weight="500" text-anchor="start" >60-second storm prologue on a failing</text><text x="99.0" y="193.6" font-size="6.9" fill="#d9d2bf" font-family="Barlow" font-weight="500" text-anchor="start" >raft: steer, bail, hold on (it reuses</text><text x="99.0" y="201.9" font-size="6.9" fill="#d9d2bf" font-family="Barlow" font-weight="500" text-anchor="start" >storm cells and hull damage)</text><line x1="240.0" y1="196.7" x2="242.0" y2="196.7" stroke="#c5371f" stroke-width="1" /><polygon points="246.0,196.7 242.0,198.9 242.0,194.5" fill="#c5371f" stroke="none" stroke-width="1" /><polygon points="250.0,162.3 392.0,162.3 392.0,226.0 387.0,231.0 245.0,231.0 245.0,167.3" fill="#0d1113" stroke="#c5371f" stroke-width="1" /><text x="251.0" y="173.3" font-size="9" fill="#c5371f" font-family="Saira Stencil One" text-anchor="start" >2</text><text x="250.0" y="185.3" font-size="6.9" fill="#d9d2bf" font-family="Barlow" font-weight="500" text-anchor="start" >Towed home (the existing 'Swamped'</text><text x="250.0" y="193.6" font-size="6.9" fill="#d9d2bf" font-family="Barlow" font-weight="500" text-anchor="start" >sequence, game.ts:896) and given the</text><text x="250.0" y="201.9" font-size="6.9" fill="#d9d2bf" font-family="Barlow" font-weight="500" text-anchor="start" >Patchwork Skiff by Marlo</text><line x1="391.0" y1="196.7" x2="393.0" y2="196.7" stroke="#c5371f" stroke-width="1" /><polygon points="397.0,196.7 393.0,198.9 393.0,194.5" fill="#c5371f" stroke="none" stroke-width="1" /><polygon points="401.0,162.3 543.0,162.3 543.0,226.0 538.0,231.0 396.0,231.0 396.0,167.3" fill="#0d1113" stroke="#c5371f" stroke-width="1" /><text x="402.0" y="173.3" font-size="9" fill="#c5371f" font-family="Saira Stencil One" text-anchor="start" >3</text><text x="401.0" y="185.3" font-size="6.9" fill="#d9d2bf" font-family="Barlow" font-weight="500" text-anchor="start" >Wren's board offers 3 leads: Turtle's</text><text x="401.0" y="193.6" font-size="6.9" fill="#d9d2bf" font-family="Barlow" font-weight="500" text-anchor="start" >bottle, the Sunken Tower salvage, Kai's</text><text x="401.0" y="201.9" font-size="6.9" fill="#d9d2bf" font-family="Barlow" font-weight="500" text-anchor="start" >raft</text><line x1="542.0" y1="196.7" x2="544.0" y2="196.7" stroke="#c5371f" stroke-width="1" /><polygon points="548.0,196.7 544.0,198.9 544.0,194.5" fill="#c5371f" stroke="none" stroke-width="1" /><polygon points="552.0,162.3 694.0,162.3 694.0,226.0 689.0,231.0 547.0,231.0 547.0,167.3" fill="#0d1113" stroke="#c5371f" stroke-width="1" /><text x="553.0" y="173.3" font-size="9" fill="#c5371f" font-family="Saira Stencil One" text-anchor="start" >4</text><text x="552.0" y="185.3" font-size="6.9" fill="#d9d2bf" font-family="Barlow" font-weight="500" text-anchor="start" >Complete any 2 → free play. The third</text><text x="552.0" y="193.6" font-size="6.9" fill="#d9d2bf" font-family="Barlow" font-weight="500" text-anchor="start" >stays on the Log</text></svg>